name: application-resilience
description: Measure HTTP application behaviour during network impairment

application:
  specification: ../../examples/sample-app/application.yaml

network:
  latency_ms: 100
  packet_loss_percent: 2

duration_seconds: 30

checks:
  - name: container-identity
    command:
      - /usr/bin/id
      - -u
    timeout_seconds: 3
    expected_exit_code: 0

  - name: operating-system-check
    command:
      - /usr/bin/test
      - -r
      - /etc/os-release
    timeout_seconds: 3
    expected_exit_code: 0

  - name: temporary-directory-check
    command:
      - /usr/bin/test
      - -d
      - /tmp
    timeout_seconds: 3
    expected_exit_code: 0
